# Inventory: real, iconic American performance cars from the 1960s-1980s (ADR-0011).
# Specs come from the model sheets in db/sheets/ (sources listed there). The individual cars,
# their history and ALL prices are fictional game data.
#
# `pricing` is SECRET: it defines the range each game's floor is sampled from.
# Every game samples its own non-round floor in [floor_min_usd, floor_max_usd].

cars:
