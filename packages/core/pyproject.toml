[project]
name = "haggle-core"
version = "0.1.0"
description = "Shared contracts, settings and database models. Must stay free of agent frameworks."
requires-python = ">=3.13,<3.14"
dependencies = [
    "langfuse>=4.15.6",
    "opentelemetry-api>=1.42.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.4",
]

[project.scripts]
haggle-seed = "haggle_core.seed:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
