# Local development stack: db, mcp, seller and api (the whole game on your machine).
#   make db-up        start only Postgres
#   docker compose up --build api
name: haggle

# Vertex AI auth inside containers (ADR-0013): your gcloud ADC file, mounted read-only. It is
# mode 600, so these services run with your UID (HOST_UID, default 1000) to be able to read it.
# Missing file = clear error (create_host_path: false), never an empty directory.
x-gcloud-adc: &gcloud-adc
  user: "${HOST_UID:-1000}"
  volumes:
    - type: bind
      source: ${HOME}/.config/gcloud/application_default_credentials.json
      target: /gcloud/adc.json
      read_only: true
      bind:
        create_host_path: false

services:
  db:
    # Same Postgres major version as Neon, with the pgvector extension preinstalled.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: haggle
      POSTGRES_PASSWORD: haggle # local-only credential, never used outside this machine
      POSTGRES_DB: haggle
    ports:
      - "127.0.0.1:5432:5432" # bind to localhost only: not reachable from your LAN
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro # creates haggle_test on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haggle -d haggle"]
      interval: 2s
      timeout: 3s
      retries: 30

  mcp:
    <<: *gcloud-adc
    build:
      context: .
      dockerfile: services/mcp/Dockerfile
    env_file: # Gemini backend vars (embeddings for lookup_model_sheet), LANGFUSE_*
      - path: .env
        required: false
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/adc.json
      HAGGLE_ENV: local
      HAGGLE_DATABASE_URL: postgresql+psycopg://haggle:haggle@db:5432/haggle
      HAGGLE_MCP_BACKEND: local
      # Local-only tokens. In the cloud they come from Secret Manager (week 7).
      HAGGLE_MCP_SELLER_TOKEN: local-seller-token
      HAGGLE_MCP_CATALOG_TOKEN: local-catalog-token
      HAGGLE_MCP_ALLOWED_HOSTS: '["mcp:*", "127.0.0.1:*", "localhost:*"]'
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      db:
        condition: service_healthy

  seller:
    <<: *gcloud-adc
    build:
      context: .
      dockerfile: services/seller/Dockerfile
    # Gemini backend vars and LANGFUSE_* come from your local .env (never committed).
    env_file:
      - path: .env
        required: false
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/adc.json
      HAGGLE_ENV: local
      HAGGLE_DATABASE_URL: postgresql+psycopg://haggle:haggle@db:5432/haggle
      HAGGLE_SELLER_MCP_URL: http://mcp:8100/mcp
      HAGGLE_SELLER_MCP_TOKEN: local-seller-token # must match the mcp service above
      HAGGLE_SELLER_PUBLIC_URL: http://seller:8200 # what the agent card tells the api to call
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: # LANGFUSE_* (optional)
      - path: .env
        required: false
    environment:
      HAGGLE_ENV: local
      HAGGLE_DATABASE_URL: postgresql+psycopg://haggle:haggle@db:5432/haggle
      HAGGLE_API_SELLER_URL: http://seller:8200
      HAGGLE_API_GAMES_PER_IP_PER_DAY: 100 # local only: the public demo keeps the default (5)
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      seller:
        condition: service_started

volumes:
  pgdata:
