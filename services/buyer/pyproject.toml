[project]
name = "haggle-buyer"
version = "0.1.0"
description = "Buyer agent (LangGraph + Gemini): appraises a listing over MCP and negotiates with the seller over A2A."
authors = [
    { name = "uo278036", email = "uo278036@uniovi.es" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "haggle-core",
    "httpx2>=2.13.1",
    "langchain>=1.4.4",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.0",
    "langfuse>=4.15.6",
    "langgraph>=1.2.14",
    "mcp>=2.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
haggle-buyer = "haggle_buyer.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
haggle-core = { workspace = true }
