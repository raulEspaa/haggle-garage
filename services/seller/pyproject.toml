[project]
name = "haggle-seller"
version = "0.1.0"
description = "Seller agent (Google ADK + Gemini) exposed over A2A."
authors = [
    { name = "uo278036", email = "uo278036@uniovi.es" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "a2a-sdk>=1.2",
    "google-adk[a2a]>=2.11",
    "haggle-core",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
haggle-core = { workspace = true }
